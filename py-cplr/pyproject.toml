[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdui-template-compiler"
version = "0.1.0"
description = "SDUI template compiler (Python port of the TS reference)"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sdui-compile = "sdui_template_compiler.cli:run"

[tool.setuptools.packages.find]
where = ["src"]
